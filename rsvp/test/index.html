<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSVP (embed test) — Sanya's 2nd Birthday</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --plum: #7345e8; --ink: #3b2f4a; --ground: #fdfaff; }

  html, body { margin: 0; padding: 0; background: var(--ground); }
  body {
    /* dvh tracks the shrinking viewport when iOS Safari's toolbars slide away;
       vh is the fallback for browsers without it. */
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
  }

  iframe {
    flex: 1 1 auto;
    width: 100%;
    border: 0;
    display: block;
  }

  .fallback {
    flex: 0 0 auto;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    text-align: center;
    font-size: 13px;
    color: #6b5f7a;
    background: #f3edfd;
    border-top: 1px solid #e3d9f7;
  }
  .fallback a { color: var(--plum); font-weight: 600; }
</style>
</head>
<body>

  <iframe
    id="rsvp"
    title="RSVP form"
    src="https://script.google.com/macros/s/AKfycbyxii9NbRx2-UtJVQV1CQdTlw7OYPxsmReMB7lXkjIwtTWnlI_OZv88MM1Y-sEN1il-eA/exec"
    allow="clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"></iframe>

  <!-- Always visible, not conditional: if the embedded form fails silently
       (third-party cookies blocked, frame refused) the guest still has a way
       through rather than staring at a blank panel. -->
  <p class="fallback">
    Form not loading?
    <a href="https://script.google.com/macros/s/AKfycbyxii9NbRx2-UtJVQV1CQdTlw7OYPxsmReMB7lXkjIwtTWnlI_OZv88MM1Y-sEN1il-eA/exec">Open it directly →</a>
  </p>

</body>
</html>
