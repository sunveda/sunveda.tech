name: Daily Analytics Collection

on:
  schedule:
    # 23:00 UTC = 8:00 AM JST
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  collect-analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Analytics Collector
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_TAG: ${{ secrets.CF_ZONE_TAG }}
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: node analytics/collect.mjs > analytics/report.md
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics/report.md
          git diff --cached --quiet || git commit -m "analytics: daily report $(date -u '+%Y-%m-%d')"
          git push
