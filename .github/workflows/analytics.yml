name: Daily Analytics Collection

on:
  schedule:
    # 23:00 UTC = 8:00 AM JST
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  collect-analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run Analytics Collector
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_TAG: ${{ secrets.CF_ZONE_TAG }}
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: |
          node analytics/reconcile.mjs --output-dir /tmp/analytics-output

      - name: Commit report to analytics-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch the analytics-data branch (or note it doesn't exist yet)
          git fetch origin analytics-data 2>/dev/null || true

          # Use a worktree — a completely separate directory for analytics-data.
          # This never touches the main checkout, so no site files can leak in.
          git worktree add /tmp/analytics-worktree analytics-data 2>/dev/null || \
            git worktree add --orphan -b analytics-data /tmp/analytics-worktree

          # The worktree starts empty (orphan) or with only previous reports.
          # Ensure the reports directory exists.
          mkdir -p /tmp/analytics-worktree/analytics/reports

          # Copy every newly collected or repaired report under its snapshot date.
          for report in /tmp/analytics-output/*/report.md; do
            DATE=$(basename "$(dirname "${report}")")
            cp "${report}" "/tmp/analytics-worktree/analytics/reports/${DATE}.md"
          done

          # Commit only from inside the isolated worktree.
          cd /tmp/analytics-worktree
          git add analytics/reports
          git diff --cached --quiet || git commit -m "analytics: reconcile daily reports"
          git push origin analytics-data

      - name: Store aggregate snapshot in analytics database
        env:
          ANALYTICS_INGEST_TOKEN: ${{ secrets.ANALYTICS_INGEST_TOKEN }}
        run: |
          for snapshot in /tmp/analytics-output/*/snapshot.json; do
            curl --fail-with-body --retry 3 --retry-all-errors \
              --header "Authorization: Bearer ${ANALYTICS_INGEST_TOKEN}" \
              --header "Content-Type: application/json" \
              --data-binary @"${snapshot}" \
              https://sunveda.tech/api/analytics/ingest
          done

      - name: Verify source completeness
        run: |
          node -e '
            const manifest = require("/tmp/analytics-output/manifest.json");
            const incomplete = manifest.results.filter((item) => !item.complete);
            if (incomplete.length) {
              console.error("Incomplete analytics snapshots:", JSON.stringify(incomplete));
              process.exit(1);
            }
            console.log(`All ${manifest.results.length} collected snapshots are complete.`);
          '
