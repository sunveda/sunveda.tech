name: Feedback tests
on:
  pull_request:
    paths:
      [
        "feedback/**",
        "package.json",
        "package-lock.json",
        ".github/workflows/feedback-tests.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "feedback/**",
        "package.json",
        "package-lock.json",
        ".github/workflows/feedback-tests.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:feedback
